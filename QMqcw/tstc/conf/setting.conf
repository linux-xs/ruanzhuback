# 偷偷停个车 V1.0 运行配置
# 格式：段名 + 缩进键值，值里不要带引号。带 # 的行尾为注释。

server:
  addr: :8080
  read_timeout: 10
  write_timeout: 20
  grace: 8
  allow_query_uid: false

db:
  host: 127.0.0.1
  port: 3306
  user: tstc
  secret: tstc_local_secret
  schema: tstc
  max_open: 32
  max_idle: 8

game:
  full_hours: 8
  recall_permille: 900
  ticket_permille: 800
  lock_minutes: 60
  escape_minutes: 60
  hunt_minutes: 360

patrol:
  on: true
  interval_minutes: 10
  sample: 60
  ticket_after_minutes: 180
